<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏄 Surf Quiz!</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --coral: #ef4444;
      --ocean-btn: #0077b6;
      --gold: #f59e0b;
      --correct: #10b981;
      --wave: #00b4d8;
    }

    body {
      font-family: 'Nunito', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ===== LAYERED BACKGROUNDS ===== */
    /* z-index stack: video(-3) < photo(-2) < tint(-1) < wave(0) < screen(1) < music-btn(10) */

    .bg-video {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%; min-height: 100%;
      object-fit: cover;
      z-index: -3;
      transition: opacity 0.7s;
    }
    .bg-photo {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.7s;
    }
    .bg-tint {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.7s, background 0.5s;
    }

    /* waiting: video visible, dark blue tint */
    body.waiting .bg-video { opacity: 1; }
    body.waiting .bg-tint  { opacity: 1; background: linear-gradient(to bottom, rgba(0,20,60,0.52), rgba(0,10,30,0.72)); }

    /* question: surf photo + deep ocean tint */
    body.question .bg-video { opacity: 0; }
    body.question .bg-photo { opacity: 1; background-image: url('/assets/surf3.jpg'); }
    body.question .bg-tint  { opacity: 1; background: linear-gradient(to bottom, rgba(0,15,45,0.80), rgba(0,20,60,0.88)); }

    /* reveal: different surf photo + warm sunset tint */
    body.reveal .bg-video { opacity: 0; }
    body.reveal .bg-photo { opacity: 1; background-image: url('/assets/surf4.jpg'); }
    body.reveal .bg-tint  { opacity: 1; background: linear-gradient(135deg, rgba(249,115,22,0.80) 0%, rgba(245,158,11,0.65) 50%, rgba(236,72,153,0.78) 100%); }

    /* ===== SCREENS ===== */
    .screen {
      text-align: center;
      padding: 1.5rem;
      width: 100%;
      max-width: 600px;
      position: relative;
      z-index: 1;
    }
    .hidden { display: none !important; }

    /* ===========================
       WAITING SCREEN
    =========================== */
    .waiting-logo {
      font-family: 'Pacifico', cursive;
      font-size: 5rem;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      margin-bottom: 0.25rem;
      animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    .waiting-headline {
      font-family: 'Pacifico', cursive;
      color: white;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      text-shadow: 0 3px 16px rgba(0,0,0,0.5);
      margin-bottom: 0.5rem;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }
    .waiting-sub {
      color: rgba(255,255,255,0.82);
      font-size: 1.05rem;
      font-weight: 600;
    }

    /* animated wave strip at bottom of waiting screen */
    .wave-strip {
      position: fixed;
      bottom: 0; left: 0;
      width: 200%;
      z-index: 0;
      pointer-events: none;
      animation: wave-scroll 9s linear infinite;
    }
    @keyframes wave-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    body.waiting .wave-strip  { opacity: 1; transition: opacity 0.6s; }
    body.question .wave-strip { opacity: 0; transition: opacity 0.3s; }
    body.reveal .wave-strip   { opacity: 0; transition: opacity 0.3s; }

    /* ===========================
       QUESTION SCREEN
    =========================== */
    .q-counter {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.9);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.35rem 1rem;
      border-radius: 20px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      backdrop-filter: blur(6px);
    }
    .question-text {
      color: white;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 800;
      margin-bottom: 1.25rem;
      padding: 1rem 1.25rem;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      line-height: 1.4;
      backdrop-filter: blur(10px);
    }
    .timer {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(0,180,216,0.18);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--wave);
      border: 4px solid rgba(0,180,216,0.55);
      transition: all 0.3s;
      backdrop-filter: blur(8px);
    }
    .timer.urgent {
      border-color: var(--coral);
      color: var(--coral);
      background: rgba(239,68,68,0.18);
      animation: shake 0.5s infinite;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-3px) rotate(-1deg); }
      75%       { transform: translateX(3px) rotate(1deg); }
    }

    .options { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn {
      padding: 1.1rem 1.25rem;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      color: white;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .option-btn:hover:not(.selected):not(.disabled) { transform: translateX(5px); filter: brightness(1.1); }
    .option-btn:active { transform: scale(0.96); }
    .option-btn.selected { outline: 4px solid rgba(255,255,255,0.85); transform: scale(0.97); filter: brightness(0.9); }
    .option-btn.disabled { pointer-events: none; opacity: 0.5; }
    .option-btn:nth-child(1) { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
    .option-btn:nth-child(2) { background: linear-gradient(135deg, #0077b6 0%, #005f8a 100%); }
    .option-btn:nth-child(3) { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .opt-letter {
      background: rgba(255,255,255,0.25);
      border-radius: 8px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.88rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* ===========================
       REVEAL SCREEN
    =========================== */
    .reveal-title {
      font-family: 'Pacifico', cursive;
      color: white;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 15px rgba(0,0,0,0.35);
    }
    .reveal-question {
      color: rgba(255,255,255,0.95);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }
    .reveal-options { display: flex; flex-direction: column; gap: 0.6rem; }
    .reveal-option {
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      display: grid;
      grid-template-columns: 1fr 110px 65px;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.5s;
    }
    .reveal-option.correct {
      background: linear-gradient(135deg, rgba(16,185,129,0.92) 0%, rgba(5,150,105,0.92) 100%);
      box-shadow: 0 0 28px rgba(16,185,129,0.55);
    }
    .reveal-option.wrong { background: rgba(0,0,0,0.35); }
    .vote-bar { background: rgba(255,255,255,0.28); border-radius: 4px; height: 10px; overflow: hidden; }
    .vote-bar-fill { height: 100%; background: white; border-radius: 4px; transition: width 1.2s ease-out; }
    .vote-count { text-align: right; font-size: 0.95rem; font-weight: 800; }

    #waiting-next {
      margin-top: 1.5rem;
      color: rgba(255,255,255,0.85);
      font-size: 1rem;
      font-weight: 600;
      animation: pulse 2s infinite;
    }

    /* ===========================
       MUSIC TOGGLE
    =========================== */
    .music-toggle {
      position: fixed;
      top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      width: 44px; height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      color: white;
      z-index: 10;
      transition: background 0.2s;
    }
    .music-toggle:hover { background: rgba(255,255,255,0.32); }
  </style>
</head>
<body class="waiting">

  <!-- Layered background system -->
  <video autoplay muted loop playsinline class="bg-video" id="bg-video">
    <source src="/assets/surf-video.mp4" type="video/mp4">
  </video>
  <div class="bg-photo" id="bg-photo"></div>
  <div class="bg-tint" id="bg-tint"></div>

  <!-- Animated wave (visible on waiting screen) -->
  <svg class="wave-strip" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 70" preserveAspectRatio="none">
    <path fill="rgba(0,180,216,0.35)" d="M0,35 C360,65 720,5 1080,35 C1260,50 1380,22 1440,35 L1440,70 L0,70 Z"/>
    <path fill="rgba(0,100,180,0.28)" d="M0,45 C240,18 480,60 720,42 C960,24 1200,55 1440,42 L1440,70 L0,70 Z"/>
  </svg>

  <button class="music-toggle" id="music-toggle">🔊</button>

  <!-- WAITING SCREEN -->
  <div class="screen" id="screen-waiting">
    <div class="waiting-logo">🏄</div>
    <div class="waiting-headline">Hang Loose!</div>
    <div class="waiting-sub">Waiting for the host to drop in... 🌊</div>
  </div>

  <!-- QUESTION SCREEN -->
  <div class="screen hidden" id="screen-question">
    <div class="q-counter" id="q-counter">Question 1 of 1</div>
    <div class="question-text" id="q-text"></div>
    <div class="timer" id="timer">18</div>
    <div class="options" id="options"></div>
  </div>

  <!-- REVEAL SCREEN -->
  <div class="screen hidden" id="screen-reveal">
    <div class="reveal-title" id="reveal-title">🏆 Results</div>
    <div class="reveal-question" id="reveal-question"></div>
    <div class="reveal-options" id="reveal-options"></div>
    <div class="hidden" id="waiting-next">🌊 Waiting for the next question...</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const quizId = window.location.pathname.split("/").pop();

    let timerInterval = null;
    let selectedAnswer = null;
    let currentQuestionData = null;
    let musicMuted = false;
    let totalQuestions = 1;
    let questionIndex = 0;
    let audioCtx = null;
    let musicGain = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playTickMusic() {
      stopMusic();
      try {
        const ctx = getAudioCtx();
        musicGain = ctx.createGain();
        musicGain.gain.value = musicMuted ? 0 : 0.15;
        musicGain.connect(ctx.destination);
        const notes = [523, 587, 659, 698, 784, 698, 659, 587];
        let noteIdx = 0, active = true;
        function playNote() {
          if (!active) return;
          const osc = ctx.createOscillator();
          osc.type = "square";
          osc.frequency.value = notes[noteIdx % notes.length];
          osc.connect(musicGain);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
          noteIdx++;
          setTimeout(playNote, 250);
        }
        playNote();
        musicGain._stop = () => { active = false; };
      } catch (e) {}
    }

    function playRevealSound() {
      stopMusic();
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.value = musicMuted ? 0 : 0.2;
        osc.type = "sine";
        osc.frequency.setValueAtTime(400, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(880, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    function stopMusic() {
      if (musicGain && musicGain._stop) musicGain._stop();
      musicGain = null;
    }

    document.getElementById("music-toggle").addEventListener("click", () => {
      musicMuted = !musicMuted;
      document.getElementById("music-toggle").textContent = musicMuted ? "🔇" : "🔊";
      if (musicGain) musicGain.gain.value = musicMuted ? 0 : 0.15;
    });

    function showScreen(name) {
      document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
      document.getElementById(`screen-${name}`).classList.remove("hidden");
      document.body.className = name;
    }

    socket.emit("join-quiz", quizId);

    socket.on("quiz-state", ({ state }) => {
      if (state === "waiting") showScreen("waiting");
    });

    socket.on("new-question", ({ text, options, questionIndex: qIdx, totalQuestions: total }) => {
      selectedAnswer = null;
      currentQuestionData = { text, options };
      questionIndex = qIdx !== undefined ? qIdx : 0;
      totalQuestions = total !== undefined ? total : 1;
      showScreen("question");

      document.getElementById("q-counter").textContent = `Question ${questionIndex + 1} of ${totalQuestions}`;
      document.getElementById("q-text").textContent = text;

      const optionsEl = document.getElementById("options");
      optionsEl.innerHTML = "";
      ["A","B","C"].forEach((label, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span class="opt-letter">${label}</span>${options[i]}`;
        btn.addEventListener("click", () => selectAnswer(i, btn));
        optionsEl.appendChild(btn);
      });

      let timeLeft = 18;
      const timerEl = document.getElementById("timer");
      timerEl.textContent = timeLeft;
      timerEl.classList.remove("urgent");

      playTickMusic();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 3) timerEl.classList.add("urgent");
        if (timeLeft <= 0) clearInterval(timerInterval);
      }, 1000);
    });

    function selectAnswer(index, btn) {
      if (selectedAnswer === index) return;
      selectedAnswer = index;
      document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      socket.emit("submit-vote", { quizId, answerIndex: index });
    }

    socket.on("reveal", ({ correctIndex, votes, question, options, questionIndex: qIdx, totalQuestions: total }) => {
      clearInterval(timerInterval);
      stopMusic();
      playRevealSound();
      showScreen("reveal");

      questionIndex = qIdx !== undefined ? qIdx : 0;
      totalQuestions = total !== undefined ? total : 1;

      const questionText = question || (currentQuestionData && currentQuestionData.text) || "";
      const optionsList = options || (currentQuestionData && currentQuestionData.options) || [];
      const maxVotes = Math.max(...votes, 1);

      document.getElementById("reveal-title").textContent = `🏆 Results — Q${questionIndex + 1} of ${totalQuestions}`;
      document.getElementById("reveal-question").textContent = questionText;

      const revealEl = document.getElementById("reveal-options");
      revealEl.innerHTML = "";

      optionsList.forEach((opt, i) => {
        const div = document.createElement("div");
        div.className = `reveal-option ${i === correctIndex ? "correct" : "wrong"}`;
        const pct = Math.round((votes[i] / maxVotes) * 100);
        const myChoice = i === selectedAnswer ? "👉 " : "";
        div.innerHTML = `
          <span>${myChoice}${i === correctIndex ? "⭐" : "✗"} ${opt}</span>
          <div class="vote-bar"><div class="vote-bar-fill" style="width:0%"></div></div>
          <span class="vote-count">${votes[i]} 🗳</span>
        `;
        revealEl.appendChild(div);
        setTimeout(() => {
          div.querySelector(".vote-bar-fill").style.width = `${pct}%`;
        }, 100);
      });

      const waitingMsg = document.getElementById("waiting-next");
      if (questionIndex < totalQuestions - 1) {
        waitingMsg.classList.remove("hidden");
      } else {
        waitingMsg.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
