<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      max-width: 700px;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { color: #333; margin-bottom: 1.5rem; text-align: center; }
    .question-block {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 2px solid #e9ecef;
    }
    .question-block h3 { margin-bottom: 0.75rem; color: #555; }
    .correct-label {
      font-size: 0.85rem;
      color: #28a745;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { outline: none; border-color: #667eea; }
    .options { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
    .option-row { display: flex; align-items: center; gap: 0.5rem; }
    .option-row input[type="text"] { flex: 1; margin-bottom: 0; }
    .option-row input[type="radio"] { width: 20px; height: 20px; accent-color: #28a745; }
    .option-row label { font-size: 0.8rem; color: #888; min-width: 20px; }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-success { background: #28a745; color: white; }
    .actions { display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: center; }
    .link-box {
      background: #e8f5e9;
      border: 2px solid #28a745;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      text-align: center;
    }
    .link-box a { color: #667eea; font-size: 1.1rem; font-weight: 600; word-break: break-all; }
    .link-box p { margin-bottom: 0.5rem; color: #555; }
    #admin-controls { text-align: center; margin-top: 1.5rem; }
    .hidden { display: none; }

    /* Results */
    .results-card {
      margin-top: 1.5rem;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .results-card h2 { margin-bottom: 1rem; text-align: center; }
    .result-option {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      color: white;
      font-weight: 600;
    }
    .result-option.correct { background: rgba(40, 167, 69, 0.9); box-shadow: 0 0 15px rgba(40,167,69,0.4); }
    .result-option.wrong { background: rgba(108, 117, 125, 0.7); }
    .result-bar {
      flex: 1;
      height: 10px;
      background: rgba(255,255,255,0.3);
      border-radius: 5px;
      margin: 0 1rem;
      overflow: hidden;
    }
    .result-bar-fill {
      height: 100%;
      background: white;
      border-radius: 5px;
      transition: width 1s ease-out;
    }
    .result-count { min-width: 60px; text-align: right; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Your Quiz</h1>

    <div id="quiz-form">
      <div class="question-block">
        <h3>Your Question</h3>
        <input type="text" placeholder="Enter your question..." id="q-text" />
        <span class="correct-label">Select the correct answer:</span>
        <div class="options">
          <div class="option-row">
            <input type="radio" name="correct" value="0" id="r0" checked />
            <input type="text" placeholder="Option A" class="q-option" />
          </div>
          <div class="option-row">
            <input type="radio" name="correct" value="1" id="r1" />
            <input type="text" placeholder="Option B" class="q-option" />
          </div>
          <div class="option-row">
            <input type="radio" name="correct" value="2" id="r2" />
            <input type="text" placeholder="Option C" class="q-option" />
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-success" id="create-btn">Create Quiz</button>
      </div>
    </div>

    <div id="quiz-created" class="hidden">
      <div class="link-box">
        <p>Share this link with players:</p>
        <a id="share-link" href="#" target="_blank"></a>
      </div>
      <div id="admin-controls">
        <p style="margin-bottom: 1rem; color: #555;">Players waiting... click Start when ready!</p>
        <button class="btn btn-success" id="start-btn">Start Quiz</button>
      </div>
      <div id="quiz-running" class="hidden">
        <p style="text-align: center; margin-top: 1rem; color: #555; font-size: 1.1rem;">
          Quiz is running! Waiting for votes...
        </p>
      </div>
      <div id="quiz-results" class="hidden"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let quizId = null;
    let quizData = null;

    document.getElementById("create-btn").addEventListener("click", async () => {
      const text = document.getElementById("q-text").value.trim();
      const options = [...document.querySelectorAll(".q-option")].map(i => i.value.trim());
      const correctIndex = parseInt(document.querySelector("input[name=correct]:checked").value);

      if (!text || options.some(o => !o)) {
        alert("Please fill in all fields!");
        return;
      }

      quizData = { text, options, correctIndex };

      const res = await fetch("/api/quiz", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ questions: [{ text, options, correctIndex }] }),
      });

      const data = await res.json();
      quizId = data.id;

      const link = `${window.location.origin}/play/${quizId}`;
      document.getElementById("share-link").href = link;
      document.getElementById("share-link").textContent = link;
      document.getElementById("quiz-form").classList.add("hidden");
      document.getElementById("quiz-created").classList.remove("hidden");

      socket.emit("join-quiz", quizId);
    });

    document.getElementById("start-btn").addEventListener("click", () => {
      socket.emit("start-quiz", quizId);
      document.getElementById("admin-controls").classList.add("hidden");
      document.getElementById("quiz-running").classList.remove("hidden");
    });

    socket.on("reveal", ({ correctIndex, votes }) => {
      showResults(correctIndex, votes);
    });

    async function showResults(correctIndex, votes) {
      // Always fetch fresh results from server to ensure accuracy
      try {
        const res = await fetch(`/api/quiz/${quizId}/results`);
        const data = await res.json();
        correctIndex = data.correctIndex;
        votes = data.votes;
      } catch (e) {}

      document.getElementById("quiz-running").classList.add("hidden");
      document.querySelector(".card").style.background = "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)";
      document.querySelector(".card").style.boxShadow = "none";
      document.body.style.background = "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)";

      const resultsEl = document.getElementById("quiz-results");
      resultsEl.classList.remove("hidden");

      const totalVotes = votes.reduce((a, b) => a + b, 0) || 1;

      resultsEl.innerHTML = `
        <div class="results-card">
          <h2 style="color: white;">Results</h2>
          <p style="text-align: center; color: rgba(255,255,255,0.9); margin-bottom: 1rem; font-size: 1.1rem;">${quizData.text}</p>
          ${quizData.options.map((opt, i) => {
            const pct = Math.round((votes[i] / totalVotes) * 100);
            return `
              <div class="result-option ${i === correctIndex ? 'correct' : 'wrong'}">
                <span>${i === correctIndex ? '✓' : '✗'} ${opt}</span>
                <div class="result-bar"><div class="result-bar-fill" style="width: 0%" data-pct="${pct}"></div></div>
                <span class="result-count">${votes[i]} votes</span>
              </div>
            `;
          }).join('')}
          <p style="text-align: center; color: rgba(255,255,255,0.7); margin-top: 1rem; font-size: 0.9rem;">
            Total votes: ${votes.reduce((a, b) => a + b, 0)}
          </p>
        </div>
      `;

      setTimeout(() => {
        resultsEl.querySelectorAll(".result-bar-fill").forEach(el => {
          el.style.width = el.dataset.pct + "%";
        });
      }, 100);
    }
  </script>
</body>
</html>
